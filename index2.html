
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Projects</title>

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111116;
    min-height: 100vh;
    padding: 25px;
    font-family: 'Alfa Slab One', serif;
}


.container {
    max-width: 1200px;
    min-height: 650px;
    margin: auto;
    background: #cbbdbb;
    padding: 35px;
    position: relative;
    border: 2px solid #e9dada;
}


.header {
    text-align: center;
    margin-bottom: 35px;
}

.header h1 {
    font-size: clamp(28px, 5vw, 48px);
    margin-bottom: 15px;
    color: #111;
}

.header p {
    font-family: Georgia, serif;
    font-size: 16px;
}


.back-button {
    display: inline-block;
    background: #eadcdf;
    color: black;
    padding: 12px 18px;
    border: 4px solid #827a79;
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 30px;
    box-shadow: 4px 4px #a69a98;
    transition: 0.2s;
}

.back-button:hover {
    transform: translateY(-4px);
    background: #f5e9e9;
}


.project-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}


.project-card {
    background: #eadcdf;
    border: 7px solid #827a79;
    box-shadow: 6px 6px 0 #aaa09e;
    padding: 15px;
    text-align: center;
    transition: 0.3s;
}

.project-card:hover {
    transform: translateY(-7px) rotate(-1deg);
}


.project-image {
    width: 100%;
    height: 180px;
    background: #f5ebeb;
    border: 5px solid #d2c1c1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin-bottom: 18px;
}

.project-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
}


.project-card h2 {
    font-size: 19px;
    margin-bottom: 15px;
}

.project-card p {
    font-family: Georgia, serif;
    font-size: 14px;
    line-height: 1.7;
    min-height: 90px;
    margin-bottom: 15px;
}


.view-button {
    display: inline-block;
    background: #cbb5b8;
    border: 4px solid #827a79;
    padding: 10px 15px;
    text-decoration: none;
    color: black;
    font-size: 12px;
    box-shadow: 3px 3px #aaa09e;
    transition: 0.2s;
}

.view-button:hover {
    background: #f5e9e9;
    transform: scale(1.05);
}


.footer {
    text-align: center;
    margin-top: 45px;
    font-family: Georgia, serif;
    font-size: 13px;
}


@media (max-width: 800px) {

    .project-grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 20px;
    }

    .project-card {
        max-width: 450px;
        width: 100%;
        margin: auto;
    }

    .project-card p {
        min-height: auto;
    }

}

</style>
</head>

<body>

<div class="container">

    <a href="index1.html" class="back-button">
        ← BACK TO HOME
    </a>


    <header class="header">

        <h1>MY PROJECTS</h1>

        <p>
            A collection of my creations, ideas,
            and accomplishments.
        </p>

    </header>
    <main class="project-grid">

        <section class="project-card">

            <div class="project-image">
                <img src="project1.png" alt="Project One">
            </div>

            <h2>PROJECT ONE</h2>


            <a href="https://anthon-mango.github.io/Las-Pinas_ICT10_Q2Seatwork1_Mago_Antonio/" class="view-button">
                VIEW PROJECT
            </a>

        </section>

        <section class="project-card">

            <div class="project-image">
                <img src="project2.png" alt="Project Two">
            </div>

            <h2>PROJECT TWO</h2>

            <a href="https://anthon-mango.github.io/Las-Pinas_ICT10_Q2SkillsTest_Mago_Antonio-Ezequiel/" class="view-button">
                VIEW PROJECT
            </a>

        </section>
    </main>


    <footer class="footer">

        <p>✦ THANK YOU FOR VISITING MY PROJECTS ✦</p>

    </footer>

</div>

</body>
</html>
