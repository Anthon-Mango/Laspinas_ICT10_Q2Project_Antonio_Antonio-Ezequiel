
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome Page</title>

<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111116;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    font-family: 'Alfa Slab One', serif;
}


.container {
    width: 100%;
    max-width: 1100px;
    min-height: 620px;
    background: #cbbdbb;
    padding: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}


.paper {
    width: 100%;
    max-width: 850px;
    min-height: 510px;
    background: #eadcdf;

    border: 9px solid #827a79;
    border-radius: 50px 35px 20px 20px;

    box-shadow:
        8px 8px 0 #aaa09e,
        15px 15px 0 #827a79;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 40px 25px;
    text-align: center;
    position: relative;
}


.title {
    font-size: clamp(30px, 5vw, 55px);
    color: #111;
    margin-bottom: 15px;
    text-shadow: 3px 3px #c5b4b5;
}

.subtitle {
    font-family: Georgia, serif;
    font-size: 17px;
    color: #51494a;
    margin-bottom: 35px;
}


.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
}


.nav-button {
    width: 240px;
    min-height: 125px;

    background: #f3e6e7;
    border: 7px solid #898080;

    box-shadow: 6px 6px 0 #aaa09e;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-decoration: none;
    color: #111;

    padding: 20px;
    transition: 0.25s;
}

.nav-button h2 {
    font-size: 20px;
    line-height: 1.5;
}

.nav-button p {
    font-family: Georgia, serif;
    font-size: 13px;
    margin-top: 10px;
}

.nav-button:hover {
    transform: translateY(-7px) rotate(-2deg);
    background: #fff5f5;
    box-shadow: 9px 9px 0 #827a79;
}


.footer {
    position: absolute;
    bottom: 20px;
    font-family: Georgia, serif;
    font-size: 12px;
    color: #51494a;
}


.decoration {
    position: absolute;
    font-size: 28px;
    color: #9d8b8c;
    opacity: 0.7;
}

.top-left {
    top: 25px;
    left: 35px;
}

.top-right {
    top: 25px;
    right: 35px;
}

.bottom-left {
    bottom: 45px;
    left: 35px;
}

.bottom-right {
    bottom: 45px;
    right: 35px;
}


@media (max-width: 650px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .paper {
        min-height: 650px;
        padding: 35px 15px;
    }

    .buttons {
        flex-direction: column;
        gap: 20px;
    }

    .nav-button {
        width: 220px;
    }

    .title {
        font-size: 30px;
    }

}

</style>
</head>

<body>

<div class="container">

    <main class="paper">

        <span class="decoration top-left">✦</span>
        <span class="decoration top-right">✧</span>
        <span class="decoration bottom-left">✧</span>
        <span class="decoration bottom-right">✦</span>

        <h1 class="title">
            WELCOME!
        </h1>

        <p class="subtitle">
        </p>

        <div class="buttons">

            <a href="index1.html" class="nav-button">

                <h2>
                    MEET THE<br>CREATOR
                </h2>

                <p>
                    Get to know me!
                </p>

            </a>


            <a href="index2.html" class="nav-button">

                <h2>
                    PROJECTS
                </h2>

                <p>
                    Explore my creations!
                </p>

            </a>

        </div>

        <footer class="footer">

            ✦ THANK YOU FOR VISITING ✦

        </footer>

    </main>

</div>

</body>
</html>
